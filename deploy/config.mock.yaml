# GPU-free development: two fake engines behind the gateway.
#   ICO_CONFIG_FILE=./config.mock.yaml docker compose --profile mock up --build
# See config.example.yaml for what each key means.

replicas:
  - name: mock-1
    url: http://mockengine-1:8000
    host: dev
    gpu_model: mock
    gpu_count: 1
    # Lets `ico replay` restart this fake engine under other flags. Run it from deploy/:
    #   ico replay --config config.mock.yaml --replica mock-1 --configs sweep.mock.yaml --replica-url http://localhost:8001
    launcher:
      kind: command
      start: docker compose --profile mock up -d mockengine-1
      stop: docker compose --profile mock stop mockengine-1
      env:
        ICO_MOCK_1_ARGS: "{flags}"
      flags:
        max-num-seqs: 4
  - name: mock-2
    url: http://mockengine-2:8000
    host: dev
    gpu_model: mock
    gpu_count: 1

gpu_price_per_hour:
  mock: 1.00

gateway:
  collector: collector:4317
  admin_url: http://localhost:8081

clickhouse:
  host: clickhouse
  username: ico
  database: ico
