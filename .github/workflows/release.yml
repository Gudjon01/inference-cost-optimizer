name: release

# A tag vX.Y.Z publishes the gateway and collector images to ghcr.io, and a
# GitHub release with the gateway as a static binary. The release notes are
# the tag's message, so push an annotated tag.
#
# Before tagging, set the new version in py/pyproject.toml (then `uv lock`),
# the ICO_VERSION default in deploy/docker-compose.yml and deploy/.env.example,
# and the clone command in README.md.
#
# Pull requests that touch the builds run everything but the publishing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - gateway/**
      - py/Dockerfile
      - py/pyproject.toml
      - py/uv.lock
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: ico-gateway
            context: gateway
            file: gateway/Dockerfile
          - name: ico-collector
            context: .
            file: py/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gudjon01/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  binaries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Build
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o ../dist/ico-gateway-linux-$arch ./cmd/gateway
          done
          cd ../dist && sha256sum ico-gateway-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/

  release:
    if: github.event_name == 'push'
    needs: [images, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Checkout leaves a lightweight copy of the tag; fetch the annotated one for its message.
      - run: git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --list --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "ico $GITHUB_REF_NAME" --notes-file notes.md dist/*
